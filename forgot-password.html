{% extends 'login_base.html' %}
{% load static %}

{% block title %}CCMS Forgot Password{% endblock %}

{% block content %}
<div class="wrapper">
    <div class="container auth-box">
        <div class="row border rounded-3 bg-weight shadow box-area">
            <div class="col-12 col-sm-12 col-md-6 col-lg-6 d-flex justify-content-center align-items-center flex-column left-box">
                <div class="featured-outline">
                    <img src="{% static 'images/featured_image/CCMS_image.png' %}" class="img-fluid" alt="HRM">
                </div>
                <div class="institution-name mb-3 text-center">
                    <h2><strong>Cash Collection Management System</strong></h2>
                </div>
                <small class="about-text text-wrap ps-4">CCMS for digitizing counter-based cash, cheque and DD collections.</small>
            </div>
            <div class="col-12 col-sm-12 col-md-6 col-lg-6 right-box">
                <div class="row align-items-center">
                    <div class="header-text mb-4">
                        <div class="featured-image mb-2 text-center">
                            <img src="{% static 'images/logo/logo.png' %}" class="img-fluid" alt="Company Logo">
                        </div>
                        <h3 class="text-center"><strong>Forgot Your Password?</strong></h3>
                    </div>
                    <label for="loginId" class="mb-1">Enter Your Login ID </label>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control form-control-lg bg-light fs-6" name="loginId" id="loginId" placeholder="000123xx" required>
                    </div>
                    <div class="input-group mb-3">
                        <button class="btn btn-md primary-button w-100 fs-6">Verify</button>
                    </div>
                    <div class="auth-back text-center mb-2">
                        <small><a href="{% url 'login' %}"> <i class="ri-arrow-left-long-line"></i> Back to Login</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
