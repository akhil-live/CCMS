{% extends 'base.html' %}
{% load static %}

{% block title %}Collection Centre Form{% endblock %}

{% block content %}
<div class="container">
  <div class="page-inner">
    <div class="page-header d-print-none">
      <h4 class="fw-bold mb-3">Collection Centre Form </h4>
      <ul class="breadcrumbs mb-3">
        <li class="nav-home">
          <a href="{% url 'dashboard' %}">
            <i class="ri-home-3-line"></i>
          </a>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Masters</span>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <a href="{% url 'collection-centre' %}">
            <span class="op-7">Collection Centre</span>
          </a>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Collection Centre Form</span>
        </li>
      </ul>
    </div>
    <div class="row">
      <div class="col-sm-12 col-md-12">
        <div class="card card-stats card-round">
          <div class="card-header d-print-none text-start">
              <a href="{% url 'collection-centre' %}"><button class="btn btn-black btn-sm"><strong><i class="ri-arrow-left-circle-line"></i> Back</strong></button></a>
          </div>
          <div class="card-body">
            <form action="">
              <div class="row">
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="centreName">Centre Name</label><i class="ri-asterisk"></i>
                    <input type="text" class="form-control" id="centreName" name="centreName" value="" placeholder="Enter Centre Name" required>
                  </div>                 
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="centreCode">Centre Code</label><i class="ri-asterisk"></i>
                    <input type="text" class="form-control" id="centreCode" name="centreCode" value="" placeholder="Enter Centre Code" required>
                  </div>                 
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="department">Department</label><i class="ri-asterisk"></i>
                      <select class="form-select" id="department" name="department" required>
                        <option value="">Select</option>
                        <option value="">UD Tax</option>
                        <option value="">Advertisement Tax</option>
                        <option value="">House Tax</option>
                      </select>    
                  </div>                       
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="address">Address</label><i class="ri-asterisk"></i>
                    <textarea id="address" name="address" class="form-control" rows="3" cols="20" placeholder="Type here.."></textarea>
                  </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="landmark">Landmark</label><i class="ri-asterisk"></i>
                    <input type="text" class="form-control" id="landmark" name="landmark" value="" placeholder="Enter Landmark" required>
                  </div>                 
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="city">City</label><i class="ri-asterisk"></i>
                    <input type="text" class="form-control" id="city" name="city" value="" placeholder="Enter City" required>
                  </div>                 
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="pincode">Pincode</label><i class="ri-asterisk"></i>
                    <input type="number" class="form-control" id="pincode" name="pincode" value="" required>
                  </div>                 
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="contactPerson">Contact Person</label><i class="ri-asterisk"></i>
                    <input type="text" class="form-control" id="contactPerson" name="contactPerson" value="" placeholder="Enter Contact Person" required>
                  </div>                 
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label for="mobile">Mobile No.</label><i class="ri-asterisk"></i>
                    <input type="number" class="form-control" id="mobile" name="mobile" value="" placeholder="99xxxxxxxx" required>
                  </div>                 
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                  <div class="form-group">
                    <label class="form-label">Centre Status</label><i class="ri-asterisk"></i>
                    <br>
                    <div class="selectgroup selectgroup-warning selectgroup-pills">
                      <label class="selectgroup-item">
                        <input type="radio" name="status" value="1" class="selectgroup-input" id="check1" required>
                        <span class="selectgroup-button me-2" for="check1">Active</span>
                      </label>
                      <label class="selectgroup-item">
                        <input type="radio" name="status" value="0" class="selectgroup-input" id="check2">
                        <span class="selectgroup-button" for="check2">Inactive</span>
                      </label>
                    </div>
                  </div>                     
                </div>
              </div>
              <div class="d-print-none">
                  <p class="text-start p-3">
                    <button type="submit" class="btn btn-success btn-sm" name="submit"><strong>Submit</strong></button>
                  </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div> 
{% endblock %}
